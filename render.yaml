# Render Blueprint — QFree API + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repository.
# You will be asked for CORS_ORIGINS: the web app's origin, e.g. https://qfree.vercel.app
services:
  - type: web
    name: qfree-api
    runtime: node
    # Paid plan ($7/month, 0.5 CPU, 512 MB RAM): never sleeps. Free instances sleep and were suspended on 2026-10-28.
    plan: 0.5c-512mb
    region: singapore
    # Dev dependencies are needed to compile TypeScript and to run `prisma migrate deploy` at start.
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm run start:prod -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qfree-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Browser → Vercel proxy → Render load balancer → app: the client IP is two hops back.
      - key: TRUST_PROXY
        value: "2"
      - key: LOG_LEVEL
        value: info
      # Only needed on a free instance (which sleeps after ~15 idle minutes): the API then pings its
      # own public URL every 10 minutes to stay awake. A paid instance never sleeps.
      - key: KEEP_ALIVE
        value: "false"
      # Load demo data on start, only while the database is empty (never overwrites real data).
      # Set to "false" for a clean production launch.
      - key: SEED_DEMO
        value: "true"
      # Password for the demo admin@qfree.dev account (the other demo logins use Password123).
      # Render generates it; see qfree-api → Environment in the dashboard.
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: qfree-db
    # Paid plan ($6/month, 0.1 CPU, 256 MB RAM, 1 GB disk); free databases expire after 30 days.
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: singapore
    databaseName: qfree
    postgresMajorVersion: "17"
